<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fobo terminal</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-width: 280px;
        background: #12111a;
        color: #f7f7f7;
        font: 13px/1.4 -apple-system, 'Segoe UI', system-ui, sans-serif;
      }
      .card { padding: 14px 16px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .row + .row { margin-top: 12px; }
      .title { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
      .sub { margin: 2px 0 0; font-size: 11px; color: #9899a3; }
      .divider { height: 1px; background: rgb(203 208 235 / 0.1); margin: 14px 0; }
      /* Every option header wears the title's face — one voice down the whole popup. */
      .label { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
      .hint { margin: 2px 0 0; font-size: 10px; color: #9899a3; }

      /* Apple-style switch: pill track, round white knob, iOS green when on. */
      .switch { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
      .switch input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .slider {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #39383f;
        transition: background 0.2s;
        pointer-events: none;
      }
      .slider::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 27px;
        height: 27px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 3px 8px rgb(0 0 0 / 0.35), 0 0 0 0.5px rgb(0 0 0 / 0.04);
        transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.4, 1);
      }
      input:checked + .slider { background: #34c759; }
      input:checked + .slider::before { transform: translateX(20px); }
      input:focus-visible + .slider { outline: 2px solid #516af6; outline-offset: 2px; }

      /* Segmented control for the panel side. */
      .segment {
        display: flex;
        background: #1c1b26;
        border: 1px solid rgb(203 208 235 / 0.1);
        border-radius: 8px;
        padding: 2px;
        flex-shrink: 0;
      }
      .segment button {
        border: 0;
        background: transparent;
        color: #9899a3;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .segment button[aria-pressed='true'] { background: #516af6; color: #fff; }
      .segment button:focus-visible { outline: 2px solid #516af6; outline-offset: 1px; }

      /* Opens something elsewhere rather than setting a value here, so it reads as an action. */
      .action {
        border: 1px solid rgb(203 208 235 / 0.1);
        background: #1c1b26;
        color: #f7f7f7;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .action:hover { background: #232231; }
      .action:focus-visible { outline: 2px solid #516af6; outline-offset: 1px; }
      .action[disabled] { opacity: 0.45; cursor: default; }
      .note { margin: 8px 0 0; font-size: 10px; color: #9899a3; min-height: 12px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="row">
        <div>
          <p class="title">fobo terminal</p>
          <p class="sub">Show the terminal on fomo.family</p>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="Show the terminal on fomo.family" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div>
          <p class="label">fomo panel</p>
          <p class="hint">Alerts, watchlist and feed beside the columns</p>
        </div>
        <label class="switch">
          <input id="alerts-enabled" type="checkbox" aria-label="Show the fomo panel" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <p class="label">Side</p>
        <div class="segment" role="group" aria-label="fomo panel side">
          <button id="side-left" type="button" aria-pressed="false">Left</button>
          <button id="side-right" type="button" aria-pressed="true">Right</button>
        </div>
      </div>

      <div class="row">
        <div>
          <p class="label">PnL card</p>
          <p class="hint">Balance and profit, floating over the columns</p>
        </div>
        <label class="switch">
          <input id="pnl-enabled" type="checkbox" aria-label="Show the PnL card" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div>
          <p class="label">Alert sound</p>
          <p class="hint">fomo's ding for live alerts</p>
        </div>
        <label class="switch">
          <input id="sound-enabled" type="checkbox" aria-label="Play a sound for live alerts" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div>
          <p class="label">Display settings</p>
          <p class="hint">What each token card shows, and quick buy</p>
        </div>
        <button id="display-settings" class="action" type="button">Open</button>
      </div>
      <p id="display-note" class="note"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
